<!-- TITRE -->
<div class="mb-10 text-center">
  <span class="text-3xl font-black text-slate-900">
    Créer un compte
  </span>
</div>

<!-- ERREUR GLOBALE -->
<div
  *ngIf="error()"
  class="mb-4 p-3 rounded-xl border border-red-200 bg-red-50 text-red-700 text-sm font-semibold text-center flex items-center gap-2 justify-center"
>
  <i class="fa-solid fa-circle-exclamation"></i>
  {{ error() }}
</div>

<!-- FORMULAIRE -->
<form (submit)="handleSubmit($event)" class="space-y-4" novalidate>

  <!-- NOM + PSEUDO -->
  <div class="grid grid-cols-2 gap-3">

    <!-- NOM -->
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">
        Nom <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        [(ngModel)]="name"
        name="name"
        (blur)="validateName()"
        (input)="validateName()"
        [class.border-red-400]="nameError"
        [class.border-slate-200]="!nameError"
        class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm
               focus:ring-2 focus:ring-[#478af5] outline-none font-medium"
        placeholder="Votre nom"
      />
      <p *ngIf="nameError" class="mt-1 text-xs text-red-500 font-medium">
        <i class="fa-solid fa-triangle-exclamation mr-1"></i>{{ nameError }}
      </p>
    </div>

    <!-- PSEUDO -->
    <div>
      <label class="block text-sm font-semibold text-slate-700 mb-2">
        Pseudo <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        [(ngModel)]="pseudo"
        name="pseudo"
        (blur)="validatePseudo()"
        (input)="validatePseudo()"
        [class.border-red-400]="pseudoError"
        [class.border-slate-200]="!pseudoError"
        class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm
               focus:ring-2 focus:ring-[#478af5] outline-none font-medium"
        placeholder="Votre pseudo"
      />
      <p *ngIf="pseudoError" class="mt-1 text-xs text-red-500 font-medium">
        <i class="fa-solid fa-triangle-exclamation mr-1"></i>{{ pseudoError }}
      </p>
    </div>

  </div>

  <!-- EMAIL -->
  <div>
    <label class="block text-sm font-semibold text-slate-700 mb-2">
      Email <span class="text-red-500">*</span>
    </label>
    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      (blur)="validateEmail()"
      (input)="validateEmail()"
      [class.border-red-400]="emailError"
      [class.border-slate-200]="!emailError"
      class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm
             focus:ring-2 focus:ring-[#478af5] outline-none font-medium"
      placeholder="Adresse email"
    />
    <p *ngIf="emailError" class="mt-1 text-xs text-red-500 font-medium">
      <i class="fa-solid fa-triangle-exclamation mr-1"></i>{{ emailError }}
    </p>
  </div>

  <!-- MOT DE PASSE -->
  <div>
    <label class="block text-sm font-semibold text-slate-700 mb-2">
      Mot de passe <span class="text-red-500">*</span>
    </label>
    <div class="relative">
      <input
        [type]="showPassword ? 'text' : 'password'"
        [(ngModel)]="password"
        name="password"
        (blur)="validatePassword()"
        (input)="validatePassword()"
        [class.border-red-400]="passwordError"
        [class.border-slate-200]="!passwordError"
        class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm
               focus:ring-2 focus:ring-[#478af5] outline-none font-medium pr-12"
        placeholder="Mot de passe"
      />
      <button
        type="button"
        (click)="showPassword = !showPassword"
        class="absolute inset-y-0 right-0 pr-4 flex items-center text-xl cursor-pointer select-none"
      >
        {{ showPassword ? '👁️' : '🙈' }}
      </button>
    </div>
    <p *ngIf="passwordError" class="mt-1 text-xs text-red-500 font-medium">
      <i class="fa-solid fa-triangle-exclamation mr-1"></i>{{ passwordError }}
    </p>

    <!-- FORCE DU MOT DE PASSE -->
    <div *ngIf="password && !passwordError" class="mt-2">
      <div class="strength-bar">
        <span
          class="strength-fill"
          [class]="strengthClass"
          [style.width.%]="passwordStrength"
        ></span>
      </div>
      <span class="strength-label" [class]="strengthClass + '-text'">
        {{ strengthLabel }}
      </span>
    </div>
  </div>

  <!-- CONFIRMATION -->
  <div>
    <label class="block text-sm font-semibold text-slate-700 mb-2">
      Confirmation du mot de passe <span class="text-red-500">*</span>
    </label>
    <div class="relative">
      <input
        [type]="showConfirm ? 'text' : 'password'"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        (blur)="validateConfirm()"
        (input)="validateConfirm()"
        [class.border-red-400]="confirmError"
        [class.border-slate-200]="!confirmError"
        class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm
               focus:ring-2 focus:ring-[#478af5] outline-none font-medium pr-12"
        placeholder="Confirmer le mot de passe"
      />
      <button
        type="button"
        (click)="showConfirm = !showConfirm"
        class="absolute inset-y-0 right-0 pr-4 flex items-center text-xl cursor-pointer select-none"
      >
        {{ showConfirm ? '👁️' : '🙈' }}
      </button>
    </div>
    <p *ngIf="confirmError" class="mt-1 text-xs text-red-500 font-medium">
      <i class="fa-solid fa-triangle-exclamation mr-1"></i>{{ confirmError }}
    </p>
  </div>

  <!-- SUBMIT -->
  <button
    type="submit"
    [disabled]="isSubmitting()"
    class="w-full py-3.5 bg-[#478af5] hover:bg-[#3b74cf]
           text-white rounded-xl text-sm font-bold shadow-lg
           shadow-blue-900/20 transition-all active:scale-[0.98]
           disabled:opacity-60 disabled:cursor-not-allowed
           flex items-center justify-center gap-2"
  >
    <span *ngIf="isSubmitting()" class="spinner"></span>
    {{ isSubmitting() ? 'Inscription en cours...' : "S'inscrire" }}
  </button>

</form>

<!-- LIEN LOGIN -->
<div class="mt-6 text-center">
  <p class="text-sm text-slate-500 font-medium">
    Déjà un compte ?
    <a routerLink="/login" class="text-[#478af5] hover:underline font-bold ml-1">
      Se connecter
    </a>
  </p>
</div>
