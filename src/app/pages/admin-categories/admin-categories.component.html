<div class="space-y-6 animate-in fade-in duration-500">
  <div class="space-y-4 mb-8">
    <h1 class="text-2xl font-bold text-slate-900">Liste des Catégories</h1>
  </div>

  <div class="bg-white rounded-[32px] border border-slate-100 shadow-sm overflow-hidden">
    <!-- Filters & Search -->
    <div
      class="p-4 sm:p-6 border-b border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4 relative z-20">
      <!-- Search Input -->
      <div class="relative w-full sm:flex-1 group flex items-center gap-2">
        <div class="relative flex-1">
          <lucide-icon name="search"
            class="w-5 h-5 absolute left-2 top-1/2 transform -translate-y-1/2 text-slate-400"></lucide-icon>
          <input type="text" placeholder="Rechercher" [(ngModel)]="searchQuery" (ngModelChange)="currentPage = 1"
            class="w-full pl-11 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#478af5] outline-none transition-all" />
        </div>

        <!-- Reset Button -->
        <button *ngIf="searchQuery" (click)="searchQuery = ''; currentPage = 1"
          class="p-2 text-slate-400 hover:text-[#1d4b99] hover:bg-blue-50 rounded-lg transition-all"
          title="Réinitialiser la recherche">
          <lucide-icon name="rotate-cw" class="w-4 h-4"></lucide-icon>
        </button>
      </div>

      <!-- Add Button -->
      <button (click)="openAddModal()"
        class="flex items-center gap-2 bg-[#478af5] text-white px-5 py-2 rounded-lg font-bold text-sm hover:bg-[#3b74cf] transition-all shadow-md active:scale-95 whitespace-nowrap">
        <lucide-icon name="plus" class="w-4 h-4"></lucide-icon>
        <span class="text-sm">Ajouter</span>
      </button>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm text-slate-600">
        <thead class="text-[11px] text-slate-400 uppercase tracking-widest bg-slate-50/50 border-b border-slate-100">
          <tr>
            <th class="px-6 py-5 font-bold">ID</th>
            <th class="px-6 py-5 font-bold">Catégorie</th>
            <th class="px-6 py-5 font-bold">Description</th>
            <th class="px-6 py-5 font-bold text-center">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <tr *ngFor="let cat of paginatedCategories" class="hover:bg-slate-50 transition-colors group">
            <td class="px-6 py-4 font-mono text-slate-400">{{ cat.id }}</td>
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center"
                  [style.background-color]="cat.color + '15'" [style.color]="cat.color">
                  <i class="material-icons" style="font-size: 20px;">{{ cat.icon || 'label' }}</i>
                </div>
                <div>
                  <div class="font-bold text-slate-900">{{ cat.titre }}</div>
                </div>
              </div>
            </td>
            <td class="px-6 py-4 text-slate-500 max-w-xs truncate">{{ cat.description }}</td>

            <td class="px-6 py-4 text-right">
              <div class="flex items-center justify-end gap-1">
                <button (click)="openEditModal(cat)"
                  class="p-2 text-slate-400 hover:text-[#1d4b99] transition-all rounded-lg hover:bg-blue-50">
                  <lucide-icon name="edit" class="w-5 h-5"></lucide-icon>
                </button>
                <button (click)="openDeleteModal(cat.id)"
                  class="p-2 text-slate-400 hover:text-red-600 transition-all rounded-lg hover:bg-red-50">
                  <lucide-icon name="trash2" class="w-5 h-5"></lucide-icon> </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination moved inside the rounded container -->
    <app-pagination *ngIf="totalPages > 1" [currentPage]="currentPage" [totalPages]="totalPages"
      (pageChanged)="onPageChanged($event)"></app-pagination>
  </div>
</div>
<!-- Modal Ajouter / Modifier Catégorie -->
<div *ngIf="isModalOpen"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-in fade-in duration-300">

  <div
    class="bg-white rounded-2xl shadow-xl w-full max-w-lg border border-slate-100 relative overflow-visible">

    <!-- Header -->
    <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50/50">
      <h3 class="text-lg font-extrabold text-slate-900">
        {{ isEditing ? 'Modifier la catégorie' : 'Nouvelle catégorie' }}
      </h3>
      <button (click)="closeModal()"
        class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-200 transition-colors">
        <lucide-icon name="x" class="w-5 h-5"></lucide-icon>
      </button>
    </div>

    <!-- Form -->
    <form (ngSubmit)="submitForm()">
      <div class="p-8 space-y-6">

        <!-- Titre -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Titre</label>
          <input type="text"
            [(ngModel)]="categoryForm.titre"
            name="titre"
            required
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-[#1d4b99] focus:ring-4 focus:ring-blue-500/10">
        </div>

        <!-- Description -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Description</label>
          <textarea rows="3"
            [(ngModel)]="categoryForm.description"
            name="description"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-[#1d4b99] focus:ring-4 focus:ring-blue-500/10 resize-none">
          </textarea>
        </div>

        <!-- ICON PICKER (zone critique corrigée) -->
        <div class="relative z-[10000]">

          <label class="block text-sm font-semibold text-slate-700 mb-3">Icône</label>

          <div class="relative">
            <!-- Input -->
            <input type="text"
              [(ngModel)]="iconSearchQuery"
              name="iconSearch"
              (focus)="isIconDropdownOpen = true"
              placeholder="Rechercher une icône"
              class="w-full pl-14 pr-10 h-[56px] rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-[#1d4b99] focus:ring-4 focus:ring-blue-500/10">

            <!-- Icon preview -->
            <div
              class="absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-xl flex items-center justify-center bg-white border border-slate-200 shadow-sm"
              [style.color]="categoryForm.color">
              <i class="material-icons text-[28px]">
                {{ categoryForm.icon || 'category' }}
              </i>
            </div>
          </div>

          <!-- Dropdown icônes -->
          <div *ngIf="isIconDropdownOpen"
            class="absolute left-0 right-0 mt-2 bg-white rounded-2xl shadow-2xl border border-slate-100 z-[9999] p-4">

            <div class="grid grid-cols-4 gap-4 max-h-60 overflow-y-auto">
              <button
                *ngFor="let icon of filteredIcons"
                type="button"
                (click)="selectIcon(icon)"
                class="p-3 rounded-xl hover:bg-blue-50 flex items-center justify-center transition-all">
                <i class="material-icons text-slate-600 text-[28px]">
                  {{ icon }}
                </i>
              </button>
            </div>
          </div>

          <!-- Overlay fermeture dropdown -->
          <div *ngIf="isIconDropdownOpen"
            (click)="isIconDropdownOpen = false"
            class="fixed inset-0 z-[9000] bg-transparent"></div>
        </div>

        <!-- Couleur -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Couleur</label>
          <input type="color"
            [(ngModel)]="categoryForm.color"
            name="color"
            class="w-16 h-16 rounded-xl cursor-pointer border border-slate-200">
        </div>

      </div>

      <!-- Footer -->
      <div class="px-8 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
        <button type="button" (click)="closeModal()"
          class="px-6 py-2 border rounded-xl text-slate-600">
          Annuler
        </button>
        <button type="submit"
          class="px-6 py-2 bg-[#478af5] text-white rounded-xl font-semibold">
          {{ isEditing ? 'Enregistrer' : 'Créer' }}
        </button>
      </div>
    </form>
  </div>
</div>

   
<!-- Modal de Suppression -->
<app-supp *ngIf="isDeleteModalOpen" [statutId]="categoryIdToDelete" (confirmDelete)="confirmDeleteCategory($event)"
  (cancel)="isDeleteModalOpen = false"></app-supp>
